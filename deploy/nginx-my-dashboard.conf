# my-dashboard (Next.js) — served under /my-dashboard
#
# Included from the candbright.top server block in
# /etc/nginx/sites-available/mc-dashboard. Everything here is additive: the
# existing /mc_dashboard/, /api/ and /ws locations (mc panel, port 3001) are
# untouched, and this app's API lives under /my-dashboard/api/* so it can never
# collide with the mc panel's root-level /api/*.
#
# Upstream: 127.0.0.1:3002 -> docker container mydash-web:30002
#
# Note the location has NO trailing slash. Next.js treats the bare
# /my-dashboard as canonical and answers /my-dashboard/ with a 308 to it; a
# prefix match here covers both forms and lets Next.js own that normalisation
# (adding our own redirect to the slash would ping-pong with Next.js' 308).

location /my-dashboard {
    proxy_pass http://127.0.0.1:3002;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # AI parse/chat endpoints stream (SSE) through Next.js rewrites, so
    # buffering must stay off and the read timeout has to survive a slow model.
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Resume uploads (PDF/docx).
    client_max_body_size 50m;
}
